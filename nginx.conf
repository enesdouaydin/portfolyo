server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Vite çıktısındaki içerik-hash'li dosyalar (js/css) sonsuza kadar önbelleğe alınabilir.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Video ve kapak görseli: hash'siz olduğu için kısa önbellek. Aralık (range) istekleri nginx'te açık.
  location /media/ {
    expires 7d;
    try_files $uri =404;
  }

  # Tek sayfa uygulaması: bilinmeyen yollar index.html'e düşer (React Router çözer).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
