name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Süren yayın iptal edilmez, yeni çalışma sırada bekler (GitHub Pages için önerilen ayar).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Derle
        run: npm run build
        env:
          # kullanici.github.io/<depo>/ alt yoldan sunulur; depo adı <kullanici>.github.io ise kökten.
          VITE_BASE: ${{ endsWith(github.repository, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
      # GitHub Pages dosya bulunamayınca 404.html sunar; aynı içerikle SPA rotaları (yenileme, doğrudan bağlantı) çalışır.
      - name: SPA yönlendirmesi için 404.html
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
