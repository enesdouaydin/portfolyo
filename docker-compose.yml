# Geliştirme:   docker compose up dev            → http://localhost:5173  (HMR)
# Üretim imajı: docker compose --profile prod up --build web   → http://localhost:8080
services:
  dev:
    image: node:20-alpine
    container_name: portfolyo-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./:/app
      - node_modules:/app/node_modules

  web:
    profiles: ["prod"]
    build: .
    container_name: portfolyo-web
    ports:
      - "8080:80"

volumes:
  node_modules:
